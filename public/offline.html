<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f2f82">
    <title>Anda sedang offline · IniBisa</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f6fbff; color: #17243e; font: 16px/1.5 system-ui, sans-serif; }
        main { width: min(100%, 420px); padding: 32px 24px; border-radius: 24px; background: white; box-shadow: 0 12px 40px #0f2f8214; text-align: center; }
        img { width: 72px; height: 72px; border-radius: 18px; }
        h1 { margin: 20px 0 8px; font-size: 24px; line-height: 1.2; }
        p { margin: 0 0 24px; color: #52637b; }
        a { display: inline-block; padding: 12px 20px; border-radius: 12px; background: #1555cf; color: white; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/pwa-192.png" alt="Logo IniBisa">
        <h1>Koneksi terputus</h1>
        <p>Hubungkan internet lalu coba lagi untuk membuka data dan menyimpan perubahan.</p>
        <a href="/dashboard">Coba lagi</a>
    </main>
</body>
</html>
